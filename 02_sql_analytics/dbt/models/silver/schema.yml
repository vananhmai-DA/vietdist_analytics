version: 2

models:
  - name: stg_customers
    description: Cleaned customer master data from raw.customer_master, using the latest successful ingestion batch.
    columns:
      - name: customer_id
        description: Unique customer identifier.
        tests:
          - not_null
          - unique

      - name: customer_name
        description: Customer name after trimming and null normalization.

      - name: join_date
        description: Customer join date after safe casting.

      - name: credit_limit
        description: Customer credit limit after safe numeric casting.

      - name: _batch_id
        description: Source ingestion batch used to build this staging model.
        tests:
          - not_null

  - name: stg_distributor_orders
    description: Cleaned distributor order data from raw.distributor_orders, using the latest successful ingestion batch.
    columns:
      - name: order_id
        description: Distributor order identifier.
        tests:
          - not_null

      - name: distributor_id
        description: Distributor identifier.
        tests:
          - not_null

      - name: product_id
        description: Product identifier.
        tests:
          - not_null

      - name: order_date
        description: Order date after safe date casting.

      - name: qty_ordered
        description: Ordered quantity after safe numeric casting.

      - name: qty_delivered
        description: Delivered quantity after safe numeric casting.

      - name: fill_rate_pct
        description: Fill rate percentage after safe numeric casting.

      - name: _batch_id
        description: Source ingestion batch used to build this staging model.
        tests:
          - not_null

  - name: stg_distributors
    description: Cleaned distributor master data from raw.distributor_master, using the latest successful ingestion batch.
    columns:
      - name: distributor_id
        description: Unique distributor identifier.
        tests:
          - not_null
          - unique

      - name: distributor_name
        description: Distributor name after trimming and null normalization.

      - name: tier
        description: Distributor tier after trimming and null normalization.

      - name: channel
        description: Distributor sales channel.

      - name: province
        description: Distributor province.

      - name: region
        description: Distributor region.

      - name: join_date
        description: Distributor join date after safe date casting.

      - name: credit_limit
        description: Distributor credit limit after safe numeric casting.

      - name: assigned_supervisor_id
        description: Employee ID of the assigned supervisor.

      - name: _batch_id
        description: Source ingestion batch used to build this staging model.
        tests:
          - not_null
  - name: stg_employees
    description: Cleaned employee master data from raw.employee_master, using the latest successful ingestion batch.
    columns:
      - name: employee_id
        description: Employee identifier.
        tests:
          - not_null

      - name: full_name
        description: Employee full name after trimming and null normalization.

      - name: position
        description: Employee position.

      - name: region
        description: Employee assigned region.

      - name: team
        description: Employee assigned team.

      - name: effective_date
        description: Effective date of the employee record after safe date casting.
        tests:
          - not_null

      - name: _batch_id
        description: Source ingestion batch used to build this staging model.
        tests:
          - not_null
  - name: stg_products
    description: Cleaned product master data from raw.product_master, using the latest successful ingestion batch.
    columns:
      - name: product_id
        description: Unique product identifier.
        tests:
          - not_null
          - unique

      - name: product_name
        description: Product name after trimming and null normalization.

      - name: category
        description: Product category.

      - name: sub_category
        description: Product sub-category.

      - name: unit
        description: Product selling unit.

      - name: unit_price
        description: Product unit price after safe numeric casting.

      - name: cost_price
        description: Product cost price after safe numeric casting.

      - name: weight_gram
        description: Product weight in grams after safe numeric casting.

      - name: launch_date
        description: Product launch date after safe date casting.

      - name: _batch_id
        description: Source ingestion batch used to build this staging model.
        tests:
          - not_null

  - name: stg_promotion_program
    description: Cleaned promotion program data from raw.promotion_program, using the latest successful ingestion batch.
    columns:
      - name: promotion_id
        description: Unique promotion identifier.
        tests:
          - not_null
          - unique

      - name: promotion_name
        description: Promotion name after trimming and null normalization.

      - name: promotion_type
        description: Type of promotion program.

      - name: target_channel
        description: Target sales channel for the promotion.

      - name: target_region
        description: Target region for the promotion.

      - name: start_date
        description: Promotion start date after safe date casting.

      - name: end_date
        description: Promotion end date after safe date casting.

      - name: discount_pct
        description: Discount percentage after safe numeric casting.

      - name: min_order_quantity
        description: Minimum order quantity after safe numeric casting.

      - name: budget_vnd
        description: Promotion budget in VND after safe numeric casting.

      - name: actual_cost_vnd
        description: Actual promotion cost in VND after safe numeric casting.

      - name: _batch_id
        description: Source ingestion batch used to build this staging model.
        tests:
          - not_null

  - name: stg_return_transactions
    description: Cleaned return transaction data from raw.return_transactions, using the latest successful ingestion batch.
    columns:
      - name: return_id
        description: Unique return transaction identifier.
        tests:
          - not_null
          - unique

      - name: original_order_id
        description: Original order identifier related to the return.

      - name: return_date
        description: Return date after safe date casting.

      - name: customer_id
        description: Customer identifier.

      - name: employee_id
        description: Employee identifier.

      - name: product_id
        description: Product identifier.

      - name: return_quantity
        description: Returned quantity after safe numeric casting.

      - name: unit_price
        description: Unit price after safe numeric casting.

      - name: return_amount
        description: Return amount after safe numeric casting.

      - name: _batch_id
        description: Source ingestion batch used to build this staging model.
        tests:
          - not_null

  - name: stg_sales_targets_versioned
    description: Cleaned and versioned sales target data from raw.sales_targets_raw.
    columns:
      - name: version_label
        description: Sales target version label, such as v1 or v2.
        tests:
          - not_null

      - name: version_rank
        description: Numeric rank extracted from version_label.

      - name: employee_id
        description: Employee identifier for the sales target row.
        tests:
          - not_null

      - name: target_year
        description: Target year after safe integer casting.
        tests:
          - not_null

      - name: target_month
        description: Target month after safe integer casting.
        tests:
          - not_null

      - name: month_col
        description: Standardized month label from T1 to T12.
        tests:
          - not_null

      - name: target_month_date
        description: First day of the target month.

      - name: target_revenue
        description: Target revenue after safe numeric casting.

      - name: target_quantity
        description: Target quantity after safe numeric casting.

      - name: target_new_customers
        description: Target new customers after safe numeric casting.

      - name: is_latest
        description: Boolean flag indicating whether this is the latest target version for the employee and target month.
        tests:
          - not_null

      - name: _batch_id
        description: Source ingestion batch used to build this staging model.
        tests:
          - not_null

  - name: stg_sales_transactions
    description: Cleaned sales transaction data from raw.sales_transactions, using the latest successful ingestion batch.
    columns:
      - name: order_id
        description: Sales order identifier.
        tests:
          - not_null

      - name: product_id
        description: Product identifier in the sales order.
        tests:
          - not_null

      - name: order_date
        description: Sales order date after safe date casting.

      - name: order_month
        description: Sales order month after safe integer casting.

      - name: order_year
        description: Sales order year after safe integer casting.

      - name: customer_id
        description: Customer identifier.

      - name: employee_id
        description: Employee identifier.

      - name: quantity
        description: Sales quantity after safe numeric casting.

      - name: unit_price
        description: Unit price after safe numeric casting.

      - name: discount_pct
        description: Discount percentage after safe numeric casting.

      - name: gross_amount
        description: Gross sales amount after safe numeric casting.

      - name: net_amount
        description: Net sales amount after safe numeric casting.

      - name: _batch_id
        description: Source ingestion batch used to build this staging model.
        tests:
          - not_null

  - name: stg_territory_mapping
    description: Cleaned territory mapping data from raw.territory_mapping, using the latest successful ingestion batch.
    columns:
      - name: territory_id
        description: Territory mapping identifier.
        tests:
          - not_null

      - name: employee_id
        description: Employee identifier assigned to the territory.
        tests:
          - not_null

      - name: customer_id
        description: Customer identifier assigned to the territory.
        tests:
          - not_null

      - name: effective_date
        description: Effective date of the territory assignment after safe date casting.
        tests:
          - not_null

      - name: expiry_date
        description: Expiry date of the territory assignment after safe date casting.

      - name: version
        description: Version label of the territory mapping record.

      - name: _batch_id
        description: Source ingestion batch used to build this staging model.
        tests:
          - not_null